<svg style="display: none;" aria-hidden="true">
      <defs>
        <!-- 神秘符文图案 -->
        <symbol id="rune-seal" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M50 10 L50 90 M10 50 L90 50" stroke="currentColor" stroke-width="2" />
          <circle cx="50" cy="50" r="20" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M50 30 L65 50 L50 70 L35 50 Z" fill="currentColor" opacity="0.3" />
        </symbol>
        <!-- 心形图标 (HP/活力) -->
        <symbol id="icon-heart" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor" />
        </symbol>
        <!-- 火焰图标 (灵性/MP) -->
        <symbol id="icon-flame" viewBox="0 0 24 24">
          <path d="M12 2c-1.5 4.5-3 6-3 9 0 2.5 1.5 4 3 4s3-1.5 3-4c0-3-1.5-4.5-3-9zm0 18c-3.5 0-6-2.5-6-6 0-4 2.5-6.5 4-9 1.5 2.5 4 5 4 9 0 3.5-2.5 6-6 6z" fill="currentColor" />
        </symbol>
        <!-- 大脑图标 (理智/SAN) -->
        <symbol id="icon-brain" viewBox="0 0 24 24">
          <path d="M12 2C9.5 2 7.5 4 7.5 6.5c0 1-0.5 2-1 2.5-1 1-1.5 2.5-1.5 4 0 2 1 3.5 2.5 4.5 0.5 0.5 1 1 1 2 0 1.5 1 2.5 2.5 2.5h2c1.5 0 2.5-1 2.5-2.5 0-1 0.5-1.5 1-2 1.5-1 2.5-2.5 2.5-4.5 0-1.5-0.5-3-1.5-4-0.5-0.5-1-1.5-1-2.5C16.5 4 14.5 2 12 2z" fill="currentColor" />
        </symbol>
        <!-- 剑形图标 (物理攻击) -->
        <symbol id="icon-sword" viewBox="0 0 24 24">
          <path d="M6.92 5L5 6.92l7.07 7.07-2.12 2.12L8.5 14.66 6.92 16.24l3.54 3.54 1.58-1.58-1.45-1.45 2.12-2.12L20 7.34 18.66 6l-7.29 7.29L6.92 5z" fill="currentColor" />
        </symbol>
        <!-- 盾牌图标 (防御) -->
        <symbol id="icon-shield" viewBox="0 0 24 24">
          <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm6 9.09c0 4-2.55 7.7-6 8.83-3.45-1.13-6-4.82-6-8.83V6.31l6-2.12 6 2.12v4.78z" fill="currentColor" />
        </symbol>
        <!-- 眼睛图标 (恐惧/感知) -->
        <symbol id="icon-eye" viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor" />
        </symbol>
        <!-- SVG滤镜定义 -->
        <!-- 噪点滤镜 -->
        <filter id="noise-texture">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
          <feColorMatrix in="noise" type="saturate" values="0" />
          <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend" />
          <feComposite in="blend" in2="SourceAlpha" operator="in" />
        </filter>
        <!-- 色差分离滤镜 (大失败用) -->
        <filter id="chromatic-aberration">
          <feOffset in="SourceGraphic" dx="2" dy="0" result="red" />
          <feOffset in="SourceGraphic" dx="-2" dy="0" result="blue" />
          <feBlend in="red" in2="SourceGraphic" mode="screen" result="blend1" />
          <feBlend in="blue" in2="blend1" mode="screen" />
        </filter>
        <!-- 发光滤镜 -->
        <filter id="glow-effect">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>