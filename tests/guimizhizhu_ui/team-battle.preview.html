<html lang="zh-CN">
<head>

  <style>
    body { margin: 0; min-height: 100vh; background: #242925; color: #eee; font-family: "Microsoft YaHei", sans-serif; }
    #open { position: fixed; top: 12px; left: 12px; z-index: 12000; }

<body>
  <button id="open">打开战斗系统</button>
  <form id="send_form" hidden>
    <textarea id="send_textarea" aria-label="原生输入框"></textarea>
    <button id="send_but" type="button">发送</button>
  </form>
  <script>
    const modules = {};
    let stored;
    let writes = 0;
    let tacticalResponse = '';
    let requests = 0;
    let openingPrompt = '';
    let lifeEntries = [];
    let lifeReads = 0;
    let tagEntries = [];
    let writeFailure = false;
    let deferredScene = null;
    let releaseScene = null;
    let swipes = ['未选正文', '测试楼层正文'];
    let swipeId = 1;
    const transactionFlags = {};
    let apiSettings = { useCustomApi: false };
    let chatId = 'battle-preview';
    let scriptId = 'battle-preview-script';
    const metadata = { created: new Date('2026-10-16T00:00:00Z'), preserved: true };
    const eventHandlers = {};
    const opening = { message_id: 0, role: 'assistant', message: '开场正文',
      data: { preserved: '开场变量' } };
    let sceneResponse = JSON.stringify({ 场景: '废弃仓库', 基底: { 名称: '石板路', 分级: 0 },
      笔刷: [{ 形状: 'cells', 格子: [[8, 5]], 地形: 'fireSurface', 存在回合: 3 }],
      自然环境: { 地貌: '森林', 天气: '阴', 时间: '下午' },
      可互动物品: [
      { 名称: '货箱', 描述: '堆在墙边', 数量: 3 },
      { 名称: '油灯', 描述: '挂在墙上', 数量: 1 },
    ] });
    window.cryptLord = { __stage1Modules: modules, contract: {
      initializeGlobal(key, api) { modules[key] = api; },
      releaseGlobal(key) { delete modules[key]; },
      async waitGlobalInitialized(key) { return modules[key]; },
    } };
    window.toastr = Object.fromEntries(['success', 'error', 'warning', 'info']
      .map(level => [level, text => { document.body.dataset.notice = `${level}: ${text}`; }]));
    modules['cryptLord.afterNativeHost'] = {
      getHost: () => ({ document, window }), createElement: tag => document.createElement(tag),
      listAssistantMessages: async () => [message()], tavernEvents: () => ({
        CHAT_CHANGED: 'chat', GENERATION_STARTED: 'start', GENERATION_ENDED: 'end', GENERATION_STOPPED: 'stop',
      }),
      bindEvent: (name, fn) => {
        if (name) (eventHandlers[name] ||= []).push(fn);
        return { stop() { eventHandlers[name] = (eventHandlers[name] || []).filter(handler => handler !== fn); } };
      },
    };
    let sends = 0, inputEvents = 0;
    document.getElementById('send_but').addEventListener('click', () => { sends++; });
    document.getElementById('send_form').addEventListener('submit', event => {
      event.preventDefault(); sends++;
    });
    document.getElementById('send_textarea').addEventListener('input', () => { inputEvents++; });
    modules['cryptLord.lifecycle'] = {
      createScope: () => ({ addCleanup() {}, dispose() {} }),
    };
    modules['cryptLord.equipmentState'] = { lists: [] };
    modules['cryptLord.inventoryState'] = { giftLists: [] };
    modules['cryptLord.abilityState'] = {
      loadPool: async () => ({ pathways: {} }), locked: () => Boolean(transactionFlags.locked),
    };
    modules['cryptLord.relationshipState'] = {};
    window.SillyTavern = { getCurrentChatId: () => chatId };
    const message = () => ({ message_id: 2, role: 'assistant', message: swipes[swipeId],
      swipe_id: swipeId, is_hidden: Boolean(transactionFlags.hidden),
      data: structuredClone(stored) });
    modules['cryptLord.hostApi'] = {
      scriptVariableOptions: () => ({ type: 'script', script_id: scriptId }),
      async getChatMessages(range, options = {}) {
        if (transactionFlags.readFailure) throw Error('模拟回读失败');
        const latest = message();
        const rows = range === '0' ? [opening] : range === '2' ? [latest] : [opening, latest];
        if (range !== '0' && range !== '2' && transactionFlags.user)
          rows.push({ message_id: 3, role: 'user', message: '等待回复', data: {} });
        return structuredClone(options.include_swipes ? rows.map(row => {
          const { message: text, data, ...rest } = row;
          const branches = row.message_id === 2 ? swipes : [text];
          const selected = row.message_id === 2 ? swipeId : 0;
          return { ...rest, swipe_id: selected, swipes: branches,
            swipes_data: branches.map((_, index) => index === selected ? data : { alternate: transactionFlags.branch || '保留' }),
            swipes_info: branches.map(() => ({ ...metadata, revision: transactionFlags.metadata || 0 })) };
        }) : rows);
      },
      async setChatMessages(rows) {
        if (writeFailure) throw Error('模拟写入失败');
        if (rows.length !== 1 || rows[0].message_id !== 2 || Object.keys(rows[0]).some(key =>
          !['message_id', 'data'].includes(key))) throw Error('必须只更新当前楼层变量');
        if (transactionFlags.noWrite) return;
        stored = structuredClone(rows[0].data); writes++;
        if (transactionFlags.conflictAfterWrite) stored.external = '外部保存';
        if (transactionFlags.failReadAfterWrite) transactionFlags.readFailure = true;
        if (transactionFlags.lostReceipt) throw Error('模拟保存回执丢失');
      },
      async getWorldbookNames() { return ['保命测试库', '标签测试库']; },
      async getWorldbook(book) {
        if (book === '保命测试库') { lifeReads++; return structuredClone(lifeEntries); }
        return structuredClone(tagEntries);
      },
      async generateRaw(config) {
        requests++;
        if (config.ordered_prompts[0].content.includes('战场设计师'))
          openingPrompt = config.ordered_prompts[0].content;
        if (deferredScene && config.ordered_prompts[0].content.includes('战场设计师')) await deferredScene;
        return config.ordered_prompts[0].content.includes('战场设计师')
          ? sceneResponse : tacticalResponse;
      },
    };
    modules['cryptLord.variableSettlementApi'] = {
      async readSettings() { return structuredClone(apiSettings); },
    };
    window.preview = {
      get data() { return structuredClone(stored); },
      get writes() { return writes; },
      get requests() { return requests; },
      get sends() { return sends; },
      get inputEvents() { return inputEvents; },
      get opening() { return structuredClone(opening); },
      set writeFailure(value) { writeFailure = value; },
      get openingPrompt() { return openingPrompt; },
      get lifeReads() { return lifeReads; },
      set lifeEntries(value) { lifeEntries = value; },
      set tagEntries(value) { tagEntries = value; },
      set data(value) { stored = structuredClone(value); },
      set tacticalResponse(value) { tacticalResponse = value; },
      set sceneResponse(value) { sceneResponse = value; },
      holdScene() { deferredScene = new Promise(resolve => { releaseScene = resolve; }); },
      releaseScene() { releaseScene?.(); deferredScene = null; },
      switchSwipe() { swipes.push('另一个分支'); swipeId++; },
      transaction: { flags: transactionFlags,
        settings(value) { apiSettings = value; },
        chat(value) { chatId = value; }, script(value) { scriptId = value; },
        listeners() { return Object.values(eventHandlers).reduce((sum, rows) => sum + rows.length, 0); } },
      emit(name, ...args) { for (const handler of eventHandlers[name] || []) handler(...args); },
      async refresh() { await modules['cryptLord.gameShell'].refresh(); },
    };
  </script>
