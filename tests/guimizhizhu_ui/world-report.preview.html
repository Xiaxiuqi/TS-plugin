<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界线同步报告隔离预览</title>
  <link rel="stylesheet" href="../../public/guimizhizhu_ui/shared/styles.css">
  <link rel="stylesheet" href="../../public/guimizhizhu_ui/modules/world-report/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body { margin: 0; color: #edf0ef; background: #202625; font: 14px/1.6 "Microsoft YaHei", sans-serif; }
    body > nav, #send_textarea { margin: 16px; }
    #chat { max-width: 860px; margin: auto; padding: 16px; }
    .mes { border-top: 1px solid #7e949060; padding: 16px 0; }
    .mes_text { white-space: pre-wrap; overflow-wrap: anywhere; }
    button { cursor: pointer; }
    body[data-theme="light"] { --SmartThemeBlurTintColor: #f1f5f4; --SmartThemeBodyColor: #24302d; background: #fff; color: #24302d; }
  </style>
</head>
<body>
  <nav><button id="open">世界线同步报告</button><button id="theme">切换主题</button></nav>
  <textarea id="send_textarea" aria-label="原生输入草稿">保留原生输入草稿</textarea>
  <div id="chat"></div>
  <script>
    const old = `<gametxt>档案室的煤气灯还亮着。</gametxt><details class="old"><summary>自动化系统</summary>
💠伦纳德（值夜者）
行为链片段：整理档案→返回教堂
当前状态：疲惫/警惕|正在整理文件|教堂档案室|核对签名
长期目标：调查失踪事件
近期打算：
检查当值表|进行中|今晚
关键记忆更新：昨晚有人借走了档案
💠日报与传闻
[第五纪1349年6月20日] 码头仓库将进行例行检查
</details><wlog>🕒 第五纪1349年6月20日 21:10
<!-- 模型生成规则，不展示 -->
市政厅延后了原定的听证会。</wlog>`;
    const npc = (identity, place) => ({ 身份: identity, 当前序列: '序列7', $战斗经验等级: 2, $战斗经验: 35,
      行为链片段: '核对档案→寻找证人', 当前状态: { 情绪: '警惕', 健康: '稳定', $meta: { protected: true } },
      正在做的事: '比较两份签名', 所处地点: place, 外貌: '深色外套，袖口沾着少量墨迹',
      长期目标: '弄清码头记录的去向', 近期打算: { 一: '核查进货记录|进行中|今晚', 二: '拜访旧仓库|未开始|明日' },
      事件历史: { 调查: '发现记录被替换→联系当班人员', $meta: { keep: true } }, 关键记忆: ['档案缺少最后一页', 42] });
    const floors = [
      { message_id: 0, role: 'assistant', name: '旧开场', message: old, data: { protected: true } },
      { message_id: 1, role: 'user', message: '调查档案', data: { protected: true } },
      { message_id: 2, role: 'assistant', name: '当前调查', message: `<thinking><wlog>推理中的假报告</wlog></thinking>
<gametxt>灯光照在尚未干透的笔迹上。</gametxt>
<本周目经历>序号|2\n大纲|档案调查\n在场人物|玩家、伦纳德（值夜者）</本周目经历>
<UpdateVariable><JSONPatch>{"npc_data":[{"op":"replace","path":"/奥黛丽~1霍尔/正在做的事","value":"核对证词"}]}</JSONPatch></UpdateVariable>
<wlog>🕒 第五纪1349年6月21日 22:10\n<!-- 不展示规则 -->码头巡逻队改用了新的路线。\n\n远处的仓库仍有灯光。</wlog>`,
        data: { stat_data: { 名称: '玩家' }, npc_data: { 伦纳德: npc('值夜者', '教堂档案室'),
          '奥黛丽/霍尔': npc('贵族', '霍尔家的书房'), 未修改人物: npc('商人', '商会') },
          world_data: { 日报与传闻: { '[第五纪1349年6月21日]-1': '码头仓库延长开放时间',
            '第五纪1349年6月21日-2': ['议会听证会延期', '商会公开新的货运账目'], $meta: { keep: true } } },
          otherPlugin: { keep: true } } },
      { message_id: 3, role: 'user', message: '继续', data: { protected: true } },
      { message_id: 4, role: 'assistant', name: '空报告楼层', message: '<gametxt>调查暂停。</gametxt>', data: {} },
    ];
    const protectedValue = JSON.stringify(floors), handlers = new Map(), flags = { fail: false, page: 0, hold: false, waiting: 0 };
    const events = { CHAT_CHANGED: 'chat', MESSAGE_UPDATED: 'updated', MESSAGE_SWIPED: 'swipe', MESSAGE_DELETED: 'delete',
      CHARACTER_MESSAGE_RENDERED: 'render', USER_MESSAGE_RENDERED: 'user-render', GENERATION_STARTED: 'start',
      GENERATION_ENDED: 'end', GENERATION_STOPPED: 'stop', MESSAGE_RECEIVED: 'receive' };
    let release;
    window.tavern_events = events;
    window.eventOn = (event, fn) => {
      const set = handlers.get(event) || new Set(); set.add(fn); handlers.set(event, set);
      return { stop: () => set.delete(fn) };
    };
    const emit = async (key, ...args) => { for (const fn of handlers.get(events[key]) || []) await fn(...args); };
    const modules = { 'cryptLord.hostApi': {
      async getChatMessages(range, options) {
        if (flags.hold) { flags.waiting++; await new Promise(resolve => { const prior = release; release = () => { prior?.(); resolve(); }; }); flags.waiting--; }
        if (flags.fail) throw Error('模拟楼层读取失败');
        const selected = range === '0-{{lastMessageId}}' ? floors : floors.filter(row => row.message_id === Number(range));
        const pages=selected.map(row => ({
          message_id: row.message_id, role: row.role,name:row.name,is_hidden:row.is_hidden,
          swipe_id: flags.page, swipes: [row.message, row.message],
          swipes_data: [row.data, row.data], swipes_info: [{}, {}],
        }));
        if(flags.mismatch && pages.length)pages.at(-1).swipes_data[flags.page]={unexpected:true};
        return structuredClone(options?.include_swipes ? pages : selected);
      },
      setChatMessages() { throw Error('报告禁止保存楼层'); }, getVariables() { throw Error('禁止配置访问'); },
      getWorldbook() { throw Error('禁止世界书访问'); }, generateRaw() { throw Error('禁止模型请求'); },
    } };
    window.cryptLord = { __stage1Modules: modules, contract: {
      initializeGlobal() {}, releaseGlobal() {}, async waitGlobalInitialized(key) { if (!modules[key]) throw Error(key); return modules[key]; },
    } };
    const renderNative = () => {
      document.getElementById('chat').replaceChildren(...floors.filter(row => !row.is_hidden).map(row => {
        const item = document.createElement('div'); item.className = 'mes'; item.setAttribute('mesid', row.message_id);
        const text = document.createElement('div'); text.className = 'mes_text';
        text.textContent = `#${row.message_id} · ${row.role}\n${row.message.match(/<gametxt>([\s\S]*?)<\/gametxt>/)?.[1] || row.message}`;
        item.append(text); return item;
      }));
    };
    window.preview = { floors, flags, emit, renderNative, npc,
      get api() { return modules['cryptLord.worldReportUi']; }, get service() { return modules['cryptLord.worldReport']; },
      get untouched() { return JSON.stringify(floors) === protectedValue && document.getElementById('send_textarea').value === '保留原生输入草稿'; },
      hold() { flags.hold = true; }, release() { flags.hold = false; release?.(); release = null; },
      async swipe() { flags.page++; await emit('MESSAGE_SWIPED'); },
      dispose() { preview.api.dispose(); preview.service.dispose(); },
    };
    renderNative();
    document.getElementById('open').onclick = () => preview.api.open(2);
    document.getElementById('theme').onclick = () => { document.body.dataset.theme = document.body.dataset.theme === 'light' ? 'dark' : 'light'; };
  </script>
  <script src="../../public/guimizhizhu_ui/shared/after-native-host.js"></script>
  <script src="../../public/guimizhizhu_ui/core/native-floor-source.js"></script>
  <script src="../../public/guimizhizhu_ui/core/variable-patch.js"></script>
  <script src="../../public/guimizhizhu_ui/core/journey-reader.js"></script>
  <script src="../../public/guimizhizhu_ui/core/battle-experience.js"></script>
  <script src="../../public/guimizhizhu_ui/core/world-report.js"></script>
  <script src="../../public/guimizhizhu_ui/modules/world-report/index.js"></script>
</body>
</html>
