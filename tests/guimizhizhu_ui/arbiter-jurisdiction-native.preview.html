<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仲裁人辖区原生楼层预览</title>
  <link rel="stylesheet" href="../../public/guimizhizhu_ui/modules/marionette/style.css">
  <style>
    body { margin: 0; background: #171e1c; color: #eee; font: 14px "Microsoft YaHei", sans-serif; }
    #open { margin: 10px; }
    #send_textarea { width: calc(100% - 24px); margin: 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <button id="open">打开辖区管理</button>
  <textarea id="send_textarea" aria-label="原生输入框" rows="3">保留玩家的正文草稿</textarea>
  <script>
    const modules = {};
    window.cryptLord = { __stage1Modules: modules, contract: {
      initializeGlobal(key, api) { modules[key] = api; }, releaseGlobal(key) { delete modules[key]; },
      async waitGlobalInitialized(key) { if (!modules[key]) throw Error('Missing ' + key); return modules[key]; },
    } };
    const pool = { pathways: { 仲裁人途径: ['序列9-仲裁人', '序列8-治安官', '序列6-法官'],
      观众途径: ['序列1-作家'] }, abilities: {} };
    const time = day => `第五纪1352年1月${day}日星期一12:00`;
    let stored = { stat_data: { 名称: '玩家', 当前序列: '序列6-法官',
      活力: 100, 当前活力: 80, 灵性: 100, 当前灵性: 80, 敏捷: 100, 当前敏捷: 80,
      理智: 100, 当前理智: 80, 人性: 100, 当前人性: 80, 运气: 100 },
      world_data: { 当前时间纪元: time(1) }, npc_data: { 老师: { 活力: 100, 事件历史: { 一: '原记录' } } }, cryptLord: {} };
    const initial = structuredClone(stored);
    const opening = { message_id: 0, role: 'assistant',
      message: '<gametxt>市政厅确认了玩家的辖区。</gametxt>', data: { preserved: true } };
    let id = 2, text = '<gametxt>玩家正式指定东区，并获市政厅任命。</gametxt>';
    const writes = [], requests = [];
    let settings = { useCustomApi: false }, reply = '<裁定>通过</裁定><理由>指定行为已完成</理由>';
    let writeFailure = false, requestHook = '', waiting, chatHandler;
    const message = () => ({ message_id: id, role: 'assistant', message: text, data: structuredClone(stored) });
    modules['cryptLord.afterNativeHost'] = {
      getHost: () => ({ document, window }), tavernEvents: () => ({ CHAT_CHANGED: 'chat_changed' }),
      bindEvent: (_event, handler) => { chatHandler = handler; return { stop() { chatHandler = null; } }; },
      async listAssistantMessages() { return [structuredClone(opening), message()]; },
    };
    modules['cryptLord.abilityState'] = { async loadPool() { return structuredClone(pool); } };
    modules['cryptLord.variableSettlementApi'] = { async readSettings() { return structuredClone(settings); } };
    modules['cryptLord.hostApi'] = {
      async generateRaw(config) {
        requests.push(structuredClone(config));
        if (requestHook === 'history') opening.message = '<gametxt>历史已变更。</gametxt>';
        if (requestHook === 'variables') stored.stat_data.当前灵性 = 55;
        if (requestHook === 'floor') id = 4;
        if (requestHook === 'chat') chatHandler?.();
        if (requestHook === 'wait') await new Promise(resolve => { waiting = resolve; });
        requestHook = '';
        return reply;
      },
    };
    modules['cryptLord.stateStore'] = {
      async findLatestAssistant() { return message(); },
      async writeAssistantData(messageId, data, _refresh, verify) {
        await verify();
        if (writeFailure) throw Error('模拟写入失败');
        if (messageId !== id || messageId === 0) throw Error('不允许写入其他楼层');
        stored = structuredClone(data); writes.push(messageId); return structuredClone(stored);
      },
    };
    modules['cryptLord.responseNormalizer'] = { normalize: value => ({
      message: String(value).replace(/<\/?gametxt>/g, ''),
    }) };
    window.preview = {
      get data() { return structuredClone(stored); }, set data(value) { stored = structuredClone(value); },
      get requests() { return structuredClone(requests); }, get writes() { return [...writes]; },
      get opening() { return structuredClone(opening); }, get initial() { return structuredClone(initial); },
      set reply(value) { reply = value; }, set settings(value) { settings = value; },
      set hook(value) { requestHook = value; }, set writeFailure(value) { writeFailure = value; },
      advance(day) { stored.world_data.当前时间纪元 = time(day); },
      release() { waiting?.(); waiting = null; },
    };
  </script>
  <script src="./pathway-roster.fixture.js"></script>
  <script src="../../public/guimizhizhu_ui/core/response-normalizer.js"></script>
  <script src="../../public/guimizhizhu_ui/core/audience-imagination.js"></script>
  <script src="../../public/guimizhizhu_ui/core/marionette-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/marionette-state.js"></script>
  <script src="../../public/guimizhizhu_ui/core/shaman-territory-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/arbiter-jurisdiction-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/arbiter-jurisdiction-state.js"></script>
  <script src="../../public/guimizhizhu_ui/core/state-store.js"></script>
  <script src="../../public/guimizhizhu_ui/core/native-floor-source.js"></script>
  <script src="../../public/guimizhizhu_ui/modules/pathway-roster-window/index.js"></script>
  <script src="../../public/guimizhizhu_ui/modules/arbiter-jurisdiction/index.js"></script>
  <script>
    document.querySelector('#open').onclick = () => modules['cryptLord.arbiterJurisdictionUi'].open();
  </script>
</body>
</html>
