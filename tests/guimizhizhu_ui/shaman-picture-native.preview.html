<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画中人原生楼层预览</title>
  <link rel="stylesheet" href="../../public/guimizhizhu_ui/modules/marionette/style.css">
  <style>
    body { margin: 0; background: #171e1c; color: #eee; font: 14px "Microsoft YaHei", sans-serif; }
    #open { margin: 10px; }
    #send_textarea { width: calc(100% - 24px); margin: 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <button id="open">打开画中人制造</button>
  <textarea id="send_textarea" aria-label="原生输入框" rows="3">保留玩家的正文草稿</textarea>
  <script>
    const modules = {};
    window.cryptLord = { __stage1Modules: modules, contract: {
      initializeGlobal(key, api) { modules[key] = api; }, releaseGlobal(key) { delete modules[key]; },
      async waitGlobalInitialized(key) { if (!modules[key]) throw Error('Missing ' + key); return modules[key]; },
    } };
    const pool = { pathways: {
      萨满途径: ['序列9-萨满', '序列6-画师', '序列5-绘梦者', '序列1-画界主宰'],
      占卜家途径: ['序列9-占卜家', '序列6-无面人', '序列5-秘偶大师', '序列1-诡秘侍者'],
      观众途径: ['序列1-作家'],
    }, abilities: {
      '占卜家途径-序列5': [{ name: '灵体之线', description: '完整能力', power: 3, range: 4 }],
      '占卜家途径-序列6': [{ name: '变形', power: 2 }],
    } };
    let stored = { stat_data: { 名称: '玩家', 当前途径: '萨满', 当前序列: '序列5-绘梦者',
      活力: 100, 当前活力: 80, 灵性: 200, 当前灵性: 200, 敏捷: 100,
      理智: 100, 当前理智: 100, 人性: 100, 当前人性: 100, 运气: 100,
      其他列表: {
        主材: { 名称: '梦境回廊的魔药主材料', 类型: '魔药主材料', 序列: '序列5', 数量: 4.5, 单位: '份' },
        辅材: { 名称: '星光魔药辅助材料', 类型: '魔药辅助材料', 序列: '序列6', 数量: 3, 单位: '份' },
        灵材: { 名称: '低阶灵性粉末', 类型: '灵性材料', 序列: '序列9', 数量: 20, 单位: '份' },
      } }, world_data: { 当前时间纪元: '第五纪1352年' },
      npc_data: { 老师: { 活力: 100, 事件历史: { 一: '保留记录' } } }, cryptLord: {} };
    const initial = structuredClone(stored);
    const opening = { message_id: 0, role: 'assistant', message: '<gametxt>开场正文。</gametxt>', data: { preserved: true } };
    let id = 2, text = '<gametxt>玩家准备绘制画中人。</gametxt>', writes = [], chatHandler;
    let writeFailure = false, confirmHook = '', requestCount = 0;
    const nativeConfirm = window.confirm.bind(window);
    window.confirm = text => {
      const answer = nativeConfirm(text);
      if (answer && confirmHook === 'variables') stored.stat_data.当前灵性 = 55;
      if (answer && confirmHook === 'chat') chatHandler?.();
      if (answer && confirmHook === 'floor') id = 4;
      confirmHook = ''; return answer;
    };
    const message = () => ({ message_id: id, role: 'assistant', message: text, data: structuredClone(stored) });
    modules['cryptLord.afterNativeHost'] = {
      getHost: () => ({ document, window }), tavernEvents: () => ({ CHAT_CHANGED: 'chat_changed' }),
      bindEvent: (_event, handler) => { chatHandler = handler; return { stop() { chatHandler = null; } }; },
      async listAssistantMessages() { return [structuredClone(opening), message()]; },
    };
    modules['cryptLord.abilityState'] = { async loadPool() { return structuredClone(pool); } };
    modules['cryptLord.hostApi'] = {
      async getChatMessages(range) {
        if (range === '0') return [structuredClone(opening)];
        if (range === String(id)) return [message()];
        return [structuredClone(opening), message()];
      },
      async setChatMessages(rows) {
        if (writeFailure) throw Error('模拟写入失败');
        for (const row of rows) {
          if (row.message_id !== id || row.message_id === 0 || 'message' in row) throw Error('wrong floor/write');
          stored = structuredClone(row.data); writes.push(row.message_id);
        }
      },
      async generateRaw() { requestCount++; throw Error('画中人制造不应调用模型'); },
    };
    window.preview = {
      get data() { return structuredClone(stored); }, set data(value) { stored = structuredClone(value); },
      get initial() { return structuredClone(initial); }, get writes() { return [...writes]; },
      get opening() { return structuredClone(opening); }, get requests() { return requestCount; },
      set message(value) { text = value; }, set id(value) { id = value; },
      set writeFailure(value) { writeFailure = value; }, set confirmHook(value) { confirmHook = value; },
      changeChat() { chatHandler?.(); },
    };
    document.getElementById('open').onclick = () => modules['cryptLord.shamanPictureUi'].open();
  </script>
  <script src="./pathway-roster.fixture.js"></script>
  <script src="../../public/guimizhizhu_ui/core/response-normalizer.js"></script>
  <script src="../../public/guimizhizhu_ui/core/audience-imagination.js"></script>
  <script src="../../public/guimizhizhu_ui/core/marionette-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/marionette-state.js"></script>
  <script src="../../public/guimizhizhu_ui/core/battle-field-effect-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/scroll-workshop-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/shaman-picture-reference.js"></script>
  <script src="../../public/guimizhizhu_ui/core/shaman-picture-state.js"></script>
  <script src="../../public/guimizhizhu_ui/core/state-store.js"></script>
  <script src="../../public/guimizhizhu_ui/core/native-floor-source.js"></script>
  <script src="../../public/guimizhizhu_ui/modules/pathway-roster-window/index.js"></script>
  <script src="../../public/guimizhizhu_ui/modules/shaman-picture/index.js"></script>
</body>
</html>
